name: CI/CD Pipeline - CineLog

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.12.4"

jobs:
  # ========================================
  # INTEGRAÇÃO CONTÍNUA (CI)
  # ========================================
  ci:
    name: Testes (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configurar pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # ========================================
      # INJEÇÃO DOS ARQUIVOS .ENV
      # ========================================
      - name: Gerar arquivo .env do Backend
        working-directory: ./backend
        run: |
          cat << EOF > .env
          PORT=3001
          HOST=0.0.0.0
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=5432
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=postgres
          NODE_ENV=production
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          CLOUDINARY_CLOUD_NAME=dytuyrbhh
          CLOUDINARY_API_KEY=177789857167833
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          UPLOAD_PROVIDER=cloudinary
          UPLOAD_FOLDER=cinelogplay
          ADMIN_ENABLED=true
          CORS_ORIGIN=https://cinelogplay-web.onrender.com
          FRONTEND_URL=https://cinelogplay-web.onrender.com
          API_URL=https://cinelogplay.onrender.com
          EOF

      - name: Gerar arquivo .env do Frontend
        working-directory: ./frontend
        run: |
          cat << EOF > .env
          VITE_NODE_ENV=production
          VITE_APP_NAME=CineLogPlay
          VITE_API_URL=https://cinelogplay.onrender.com
          VITE_CLOUDINARY_CLOUD_NAME=dytuyrbhh
          VITE_CLOUDINARY_UPLOAD_PRESET=cinelogplay
          VITE_APP_URL=https://cinelogplay-web.onrender.com
          VITE_ENABLE_UPLOADS=true
          VITE_ENABLE_ADMIN=true
          EOF

      # ========================================
      # STEPS DE BUILD E TESTE
      # ========================================
      - name: Cache do binário Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build
        continue-on-error: false

      - name: Iniciar servidor frontend (Vite)
        working-directory: ./frontend
        run: |
          nohup pnpm run dev > /tmp/vite.log 2>&1 &
          echo "Aguardando servidor iniciar..."
          for i in {1..60}; do
            if curl -s http://localhost:5173/pages/home.html > /dev/null 2>&1; then
              echo "Servidor rodando!"
              sleep 2
              exit 0
            fi
            sleep 1
          done
          echo "Servidor não respondeu"
          exit 1

      - name: Instalar Cypress binary
        working-directory: ./frontend
        run: pnpm exec cypress install

      - name: Rodar Cypress (Testes E2E)
        working-directory: ./frontend
        run: pnpm run test:ci
        env:
          CYPRESS_baseUrl: http://localhost:5173

  # ========================================
  # ENTREGA CONTÍNUA (CD)
  # ========================================
  cd:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: ci
    if: success() && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: CI passou! Preparando deploy
        run: |
          echo "CI passou com sucesso! Servidores Render/Vercel iniciaram o deploy."
