name: CI - Testes

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    name: Testes Cypress
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: pnpm install

      - name: Start server
        run: node backend/server.js &

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run Cypress
        run: pnpm cypress run